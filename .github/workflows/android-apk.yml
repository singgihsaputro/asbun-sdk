# Builds the Ojol Mitra debug APK on every push and keeps it as a downloadable artifact.
name: Android APK

on:
  push:
    # Any branch; skip pushes that only touch documentation.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Run it by hand from the Actions tab too.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies and build outputs between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner's preinstalled Android SDK is used through ANDROID_HOME.
      # No local.properties exists here, so the optional voice LLM stays off in this build.
      - name: Build debug APK
        run: ./gradlew :samples:ojol-mitra:androidApp:assembleDebug --stacktrace

      - name: Name the APK after the commit
        id: apk
        run: |
          file="ojol-mitra-debug-${GITHUB_SHA::7}.apk"
          cp samples/ojol-mitra/androidApp/build/outputs/apk/debug/androidApp-debug.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          size=$(du -h "$file" | cut -f1)
          {
            echo "### Debug APK"
            echo ""
            echo "\`$file\` ($size), from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA::7}\`."
            echo ""
            echo "Download it under **Artifacts** below, then install with \`adb install -r $file\` or open it on the phone."
          } >> "$GITHUB_STEP_SUMMARY"

      # archive: false uploads the .apk itself (no zip); the artifact is named after the file.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 14
